name: Release

# Push a tag such as v1.0.0 (or v1.1.0-beta.1) to publish that version to nuget.org.
# MinVer derives the package version from the tag, so there is no version to edit by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to nuget.org
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to add a manual approval step before publishing.
    environment: nuget-org
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Exchanges the workflow's OIDC token for a short-lived nuget.org API key; no long-lived secret.
      # Requires a Trusted Publishing policy on nuget.org for this repo/workflow, and the nuget.org
      # username (profile name, not email) in the NUGET_USER repository secret.
      - name: NuGet login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $prerelease
